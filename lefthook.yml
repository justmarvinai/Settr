# Git hooks (QUALITY.md §7). Installed by `pnpm install`; skip once with `git commit --no-verify`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,css,html,yml,yaml}'
      exclude:
        - src/routeTree.gen.ts
        - pnpm-lock.yaml
        - public/**
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      exclude:
        - src/routeTree.gen.ts
      run: pnpm exec oxlint --type-aware {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: unit tests
      run: pnpm test
